# 备份指定仓库到本仓库的主分支，并生成时间戳。支持定时和手动触发，并可选通知失败到 Slack。
name: Backup Repositories

# 工作流触发条件：定时（每2小时）和手动触发（workflow_dispatch）
on:
  schedule:
    - cron: '0 */2 * * *' # 每2小时执行一次（UTC时间，注意时区差异）
  workflow_dispatch:
    inputs:
      backup_comment:
        description: '手动触发时的备份备注'
        required: false
        default: 'Manual backup trigger'

jobs:
  backup:
    runs-on: ubuntu-latest             # 使用最新版 Ubuntu runner
    timeout-minutes: 15                # 失败超时时间，防止异常卡死
    env:
      BACKUP_REPOS: |                  # 集中配置需备份的仓库列表，格式：源仓库:目标目录名
        Luoyacheng/legado:legado(Luoyacheng)
        Luoyacheng/yuedu:yuedu(Luoyacheng)
        HapeLee/legado-with-MD3:legado-with-MD3(HapeLee)
      TARGET_BRANCH: main              # 备份提交目标分支

    steps:
      # 显示运行环境及备份时间，方便后续调试定位
      - name: Check environment
        run: |
          echo "Environment: Ubuntu $(lsb_release -rs)"
          echo "Git version: $(git --version)"
          echo "Backup time: $(date +'%Y-%m-%d %H:%M:%S %Z')"

      # 检出本仓库代码，用于保存备份文件
      - name: Checkout repository
        uses: actions/checkout@v4       # 推荐使用最新版 checkout action
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1                # 仅拉取最近一次提交，加快速度
          ref: ${{ env.TARGET_BRANCH }}

      # 安装 Git LFS（大文件支持），可选，部分仓库可能不需要
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git-lfs

      # 批量克隆需备份的仓库，并移动到指定目录。自动处理历史、隐藏文件等。
      - name: Batch clone and backup repositories
        run: |
          set -e    # 出错立即中断
          while IFS=: read -r repo target_dir; do
            echo "=== Backing up repository: $repo to $target_dir ==="
            temp_dir="temp_$(echo $repo | tr '/' '_')"   # 临时目录名
            if [ -d "$target_dir" ]; then
              echo "Cleaning old backup directory: $target_dir"
              rm -rf "$target_dir"
            fi

            echo "Cloning repository: https://github.com/$repo"
            if ! git clone --depth=1 --branch main "https://github.com/$repo" "$temp_dir"; then
              echo "❌ Failed to clone $repo, skipping."
              rm -rf "$temp_dir"
              continue                         # 单个仓库失败不影响整体流程
            fi

            mkdir -p "$target_dir"
            shopt -s dotglob nullglob          # 支持移除隐藏文件和空目录
            mv "$temp_dir"/* "$target_dir"/
            rm -rf "$temp_dir"
            echo "✅ $repo backup complete"
          done <<< "$BACKUP_REPOS"

      # 生成备份时间戳文件，写入触发方式、手动备注及备份仓库列表
      - name: Update backup timestamp
        run: |
          cat > backup-timestamp.txt <<EOF
          Last backup time: $(date +'%Y-%m-%d %H:%M:%S %Z')
          Trigger type: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
          ${{ github.event_name == 'workflow_dispatch' && format('Manual comment: {0}', github.event.inputs.backup_comment) || '' }}
          Repositories backed up:
          $(echo "$BACKUP_REPOS" | awk -F: '{print "- " $1 " -> " $2}')
          EOF

      # 提交更改（含新备份和时间戳），推送到 main 分支
      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if ! git diff-index --quiet HEAD --; then          # 有变更才提交
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              commit_msg="Manual backup: $(date +'%Y-%m-%d %H:%M:%S') | ${{ github.event.inputs.backup_comment }}"
            else
              commit_msg="Automated backup: $(date +'%Y-%m-%d %H:%M:%S')"
            fi

            git commit -m "$commit_msg"
            git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPO}.git"
            git push origin "$TARGET_BRANCH"
            echo "✅ Changes pushed."
          else
            echo "ℹ️ No changes to commit."
          fi

      # 备份任务失败时，提供 Slack 通知支持（可选配置，需要设置 SLACK_WEBHOOK_URL）
      - name: Failure notification (optional)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
