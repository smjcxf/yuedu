name: Backup Repositories

于:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时执行一次（UTC时间，注意时区差异）
  workflow_dispatch:  # 允许手动触发
    inputs:
      backup_comment:
        description: '手动备份备注'
        required: false
        默认: 'Manual backup trigger'

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 防止任务无限运行
    env:
      # 集中配置备份源（新增 HapeLee/legado-with-MD3 仓库）
      BACKUP_REPOS: |
        Luoyacheng/legado:legado(Luoyacheng)
        Luoyacheng/yuedu:yuedu(Luoyacheng)
        HapeLee/legado-with-MD3:legado-with-MD3(HapeLee)  # 新增仓库：源仓库:目标目录名
      TARGET_BRANCH: main  # 目标分支（统一配置）

    steps:
      - name: 检查运行环境
        run: |
          echo "运行环境：Ubuntu $(lsb_release -rs)"
          echo "Git 版本：$(git --version)"
          echo "备份时间：$(date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: 检出备份仓库
        uses: actions/checkout@v4  # 升级到最新稳定版
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1  # 仅拉取最新提交，加快速度
          ref: ${{ env.TARGET_BRANCH }}

      - name: 安装依赖（可选，确保git正常工作）
        run: sudo apt-get update && sudo apt-get install -y git-lfs  # 支持LFS仓库（如果需要）

      - name: 批量克隆并备份仓库
        run: |
          # 循环处理所有需要备份的仓库
          while IFS=: read -r repo target_dir; do
            echo "=== 开始备份仓库：$repo 到 $target_dir ==="
            
            # 临时目录（避免命名冲突）
            temp_dir="temp_$(echo $repo | tr '/' '_')"
            
            # 清理旧目录（如果存在）
            if [ -d "$target_dir" ]; then
              echo "清理旧备份目录：$target_dir"
              rm -rf "$target_dir"
            fi
            
            # 克隆仓库（--depth=1 仅保留最新版本，减少体积）
            echo "克隆仓库：https://github.com/$repo"
            if ! git clone --depth=1 --branch main "https://github.com/$repo" "$temp_dir"; then
              echo "❌ 克隆 $repo 失败，跳过该仓库"
              continue  # 单个仓库失败不影响整体流程
            fi
            
            # 移动文件到目标目录
            mkdir -p "$target_dir"
            mv "$temp_dir"/* "$target_dir"/ 2>/dev/null || true  # 忽略空目录警告
            mv "$temp_dir"/.* "$target_dir"/ 2>/dev/null || true  # 移动隐藏文件（如.gitignore）
            
            # 清理临时目录
            rm -rf "$temp_dir"
            echo "✅ $repo 备份完成"
          done <<< "$BACKUP_REPOS"

      - name: 更新备份时间戳
        run: |
          # 时间戳文件包含更详细的信息
          cat > backup-timestamp.txt <<EOF
          最近备份时间：$(date +'%Y-%m-%d %H:%M:%S %Z')
          触发方式：${{ github.event_name == 'workflow_dispatch' && '手动触发' || '定时触发' }}
          ${{ github.event_name == 'workflow_dispatch' && format('手动备注：{0}', github.event.inputs.backup_comment) || '' }}
          备份仓库列表：
          $(echo "$BACKUP_REPOS" | awk -F: '{print "- " $1 " -> " $2}')
          EOF

      - name: 提交并推送更改
        env:
          PAT: ${{ secrets.PAT }}
          GITHUB_REPO: ${{ github.repository }}  # 自动获取当前仓库（无需硬编码）
        run: |
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有变更（包括时间戳文件）
          git add .
          if ! git diff-index --quiet HEAD --; then
            # 根据触发方式生成提交信息
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              commit_msg="Manual backup: $(date +'%Y-%m-%d %H:%M:%S') | ${{ github.event.inputs.backup_comment }}"
            else
              commit_msg="Automated backup: $(date +'%Y-%m-%d %H:%M:%S')"
            fi
            
            # 提交并推送
            git commit -m "$commit_msg"
            git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPO}.git"
            git push origin "$TARGET_BRANCH" --force-with-lease  # 安全推送（避免覆盖他人提交）
            echo "✅ 更改已成功推送"
          else
            echo "ℹ️  无任何变更，无需提交"
          fi

      - name: 备份失败通知（可选）
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}  # 需要在仓库 Secrets 中配置
